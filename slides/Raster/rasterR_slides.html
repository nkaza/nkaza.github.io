## Thinking in Rasters

##### Nikhil Kaza
##### Department of City &amp; Regional Planning &lt;br /&gt; University of North Carolina at Chapel Hill
###### updated: 2026-09-22

---

# Fields vs. Objects

This is an age old debate as to which is a better representation of reality.

Objects: Discrete, sharply defined boundaries, have distinct attributes (e.g. buildings, roads, parcels, census tracts)
  - Need to keep track of topology and spatial relations among them

Fields: Something that varies continuously over space. The discretisation is an artefact of the data storage and representation (e.g. temperature, ground level, urbanicity)
  - Topological relationships are embedded

Usually fields are represented by rasters.

---

# What is a raster, really?

A raster is a grid of cells (pixels), each holding a value. Rasters show up well outside geography:

None of these are geospatial, but they have a coordinate system.

---

# Key features of any raster

- **Grid structure** — rows and columns, forming a rectangular array

- **Pixel values** — each cell holds a number: brightness, elevation, intensity, a class label

- **Resolution** — the size of each cell; smaller cells mean finer detail

- **Bands/layers** — a raster can carry several layers at once (e.g. R, G, B channels, or timestamps), and layers can also stack observations of the same place over time

- **Spatial context** *(optional)* — if a raster is georeferenced, the coordinates of its corners plus its resolution locate every pixel in the world. If not, it's just a grid.

# Part I (continued)
## Four ways to think about a raster

---

# 1. A raster as a table

Each pixel is a row. Each band is a column.  
- **A raster is a tibble that happens to have a grid layout.**

&lt;img src="./includes/raster_animation.gif" alt="" width="75%" /&gt;



---

# 2. A raster as a matrix

Equivalently: each band is its own matrix, and a multi-band raster is a stack of matrices of identical dimensions.


&lt;img src="./includes/raster_as_matrix.gif" alt="" width="85%" /&gt;

---

# 3. A raster as a graph

Pixels are nodes. Edges connect neighboring pixels. The definition of "neighbour" (rook, queen, k-th order) is a modelling choice.

&lt;img src="./includes/raster_graph.png" alt="" width="70%" /&gt;

This framing matters whenever an operation depends on *connectivity* rather than *position* — moving-window filters, cost-distance and regionalisation

---

# 4. A raster as sampled continuity

A raster can also be seen as a discrete sample of an underlying continuous surface — elevation, temperature, reflectance — independent of how finely we chose to grid it.

&lt;img src="./includes/raster_continuous_surface.gif" alt="" width="65%" /&gt;

Resolution is then a sampling-rate decision, and operations like resampling/aggregation are really questions about how to re-sample that surface.

---

# Which framing, when?

- Reaching for `dplyr`-style verbs, joining pixel values to other data, tidy plotting → **table**

- Linear algebra, image filters expressed as matrix operations → **matrix**

- Connectivity, adjacency, shortest paths, region-growing → **graph**

- Interpolation, resampling, "what's the true value between these cells?" → **continuous surface**

None of these is the "correct" one. Pick the framing that matches the question you're asking.

# Part III
## `terra` basics
### thought about the tidyverse way

---

# Why `terra`?

- Successor to Robert Hijmans' `raster` package (`raster` is now in maintenance mode)

- One class, `SpatRaster`, replaces `RasterLayer` / `RasterStack` / `RasterBrick`

- Fast, out-of-memory processing — handles rasters larger than RAM

- Plays well with `sf` (vectors) and the tidyverse (`as.data.frame()`, pipes)

We'll use `terra` throughout. Some older packages (e.g. `gdistance`) still expect the legacy `raster` classes.

---

# Moving windows

`focal()` slides a window over the 2-D grid — the spatial cousin of a rolling window over a 1-D time series.

.pull-left[

``` r
# 3x3 mean filter, in space
smoothed &lt;- focal(r1, w = matrix(1/9, 3, 3))
round(values(smoothed)[1:8], 1)
```

```
## [1] NaN NaN NaN NaN NaN NaN NaN NaN
```
]

.pull-right[

``` r
# 3-point mean filter, in time
x &lt;- rnorm(10)
round(zoo::rollmean(x, k = 3, fill = NA), 1)
```

```
##  [1]   NA -0.1  0.1 -0.4 -0.7 -0.6 -0.1  0.3  0.1   NA
```
]

Same idea — local averaging over a neighborhood — different notion of "neighbor" (grid cells vs. adjacent time points).

---

# The same mechanism, side by side

A window of fixed size slides across the data, one step at a time, and summarizes whatever falls inside it. Whether "next" means the next time point or the next grid cell is the only real difference.

# Count percentage of cells

`extract()` returns one row per cell per polygon — a long table you then `group_by()` and `summarize()`, just as you would after a spatial join.


``` r

  group_by(ID, class) %&gt;%
  summarize(count = n(), .groups = "drop_last") %&gt;%
  mutate(pct = count / sum(count))
```

# Least-cost path: raster as graph, again

Recall Way 3 — a raster can be a graph, with pixels as nodes and neighbors as edges. `gdistance` builds exactly that graph to find a cheapest path.


``` r
cost &lt;- classify(r1, rcl = matrix(c(-Inf,200,20, 200,400,30,
                                        400,900,NA, 900,Inf,40),
                                       ncol=3, byrow=TRUE)) # toy cost surface
A &lt;- c(179706.2, 330570.0)
B &lt;- c(180100.9, 331074.3)
plot(cost)
```

&lt;img src="figs/unnamed-chunk-28-1.png" alt="" width="70%" /&gt;

---


``` r
library(raster)     # gdistance predates terra; it wants the legacy class
library(gdistance)
conductance &lt;- transition(raster::raster(cost), function(x) 1/mean(x), 8)
AtoB &lt;- shortestPath(conductance, A, B, output = "SpatialLines")
plot(cost)
lines(AtoB, col="red", lwd=2)
```

&lt;img src="figs/unnamed-chunk-29-1.png" alt="" width="50%" /&gt;

Not every package has migrated to `terra` — `raster::raster()` converts back to the legacy class when a downstream package needs it.

# Some key things to think about

A few properties of rasters surprise people the first time they work with real data 

1. `NA` values are used to define shape

2. Data type determines size

3. Reprojecting a raster is costly

4. Units live in metadata, not in the raster itself

---

# 1. `NA` defines the shape

A raster's *extent* is always a rectangle. Almost nothing real is. `NA` carves an arbitrary shape out of that rectangle — "no data" and "outside the thing I care about" are the same value.


``` r
r1 &lt;- rast(system.file("external/test.grd", package="raster"))
par(mfrow = c(1, 2))
plot(r1, main = "Values (blank = NA)")
plot(!is.na(r1), col = c("grey85", "steelblue"), legend = FALSE,
     main = "Same rectangle, valid cells only")
```

&lt;img src="figs/unnamed-chunk-30-1.png" alt="" width="70%" /&gt;

---

# 1. `NA` defines the shape


``` r
ncell(r1)                # the full rectangle
```

```
## [1] 9200
```

``` r
sum(!is.na(values(r1)))  # cells actually "inside" the shape
```

```
## [1] 3178
```

Two-thirds of this rectangle is `NA` — not missing data we wish we had, just bookkeeping. (Recall: `as.data.frame()` earlier silently returned only 3,178 rows, for exactly this reason.)

---

# 2. Data type determines size

A cell is just a number, but *how* that number is stored is a choice you make, not a fact about the data.

.pull-left[

``` r
tmp &lt;- tempfile(fileext = ".tif")
file_size &lt;- function(r, dt) {
  writeRaster(r, tmp, datatype = dt,
              overwrite = TRUE)
  file.size(tmp)
}
tibble::tibble(
  datatype = c("FLT8S", "FLT4S",
               "INT2S", "INT1U (mask)"),
  bytes = c(
    file_size(r1, "FLT8S"),
    file_size(r1, "FLT4S"),
    file_size(round(r1), "INT2S"),
    file_size(!is.na(r1), "INT1U"))
)
```
]

.pull-right[

|datatype     | bytes|
|:------------|-----:|
|FLT8S        | 20740|
|FLT4S        | 17200|
|INT2S        |  7701|
|INT1U (mask) |  1955|

Same values, four sizes. `INT2S` rounds to the nearest meter; the #1 mask only needs 0/1, so `INT1U` fits it alone.
]

---

# 3. Reprojecting a raster is costly

Reprojecting a vector just recomputes vertex coordinates. Reprojecting a raster has to build a **new grid** and resample every cell onto it — there's no shortcut.


``` r
box &lt;- as.polygons(ext(r1), crs = crs(r1))
t_vec  &lt;- system.time(project(box, "EPSG:4326"))[["elapsed"]]
t_rast &lt;- system.time(r1_ll &lt;- project(r1, "EPSG:4326"))[["elapsed"]]

tibble::tibble(what = c("vector: recompute corners", "raster: resample ~9,200 cells"),
               seconds = c(t_vec, t_rast))
```



|what                          | seconds|
|:-----------------------------|-------:|
|vector: recompute corners     |   0.002|
|raster: resample ~9,200 cells |   0.008|

``` r
cat("cell count:", ncell(r1), "-&gt;", ncell(r1_ll), "(a *different* grid)")
```

```
## cell count: 9200 -&gt; 9975 (a *different* grid)
```

This toy raster still does measurably more work than its vector counterpart, and cost scales with cell count — for a drone- or satellite-sized raster that gap runs to minutes.

---

# 4. Units live in metadata

A cell holds a bare number. Whether that number means meters, feet, or reflectance is a label someone attached — `terra` stores it, but never checks it.


``` r
units(r1)                 # this file ships with no units at all
```

```
## [1] ""
```

``` r
feet &lt;- r1 * 3.28084       # actually converted to feet...
units(feet) &lt;- "m"             # ...but nothing stops a wrong label
units(feet)
```

```
## [1] "m"
```


``` r
linearUnits(r1)   # meters per coordinate unit — THIS is enforced by the CRS
```

```
## [1] 1
```

The **spatial** unit (what an X/Y coordinate means) is guaranteed by the CRS. The **value** unit (what a cell's number means) is not — it's on you to check and document it.
